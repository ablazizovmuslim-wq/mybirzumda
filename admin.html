<!DOCTYPE html>
<html lang="ru" data-theme="dark" data-accent="purple">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Админ-панель — Birzumda</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%237c3aed'/%3E%3Cpath d='M36 8 16 36h14l-4 20 22-30H34z' fill='white'/%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg"><div class="blob b1"></div><div class="blob b2"></div></div>

  <header class="header">
    <a href="index.html" class="brand">
      <svg viewBox="0 0 64 64" class="logo-icon"><rect width="64" height="64" rx="16" fill="var(--accent)"/><path d="M36 8 16 36h14l-4 20 22-30H34z" fill="#fff"/></svg>
      <span>Admin</span>
    </a>
    <div class="header-actions">
      <button class="btn btn-ghost" id="refreshBtn">🔄</button>
      <a href="cabinet.html" class="btn btn-ghost">👤 Кабинет</a>
    </div>
  </header>

  <main class="page">
    <h1>🛠 Birzumda Tayyorla</h1>

    <section class="kpis">
      <div class="kpi glass"><span>👥 Пользователи</span><b id="users">—</b><small class="muted" id="usersToday"></small></div>
      <div class="kpi glass"><span>💰 Выручка</span><b id="revenue">—</b><small class="muted" id="revenueToday"></small></div>
      <div class="kpi glass"><span>📦 Заказы</span><b id="ordersTotal">—</b><small class="muted" id="ordersStatus"></small></div>
    </section>

    <section class="glass block">
      <h2>⭐ Отзывы на проверке</h2>
      <div id="reviews"></div>
    </section>

    <section class="glass block">
      <h2>📋 Последние заказы</h2>
      <div id="orders"></div>
    </section>

    <section class="glass block">
      <h2>🎟 Активные промокоды</h2>
      <div id="promos"></div>
      <p class="muted">Создавать промокоды — в боте: <code>/promo</code> или <code>/haftalik 15</code></p>
    </section>
  </main>

  <div class="toast" id="toast"></div>
  <script src="core.js"></script>
  <script src="admin.js"></script>
</body>
</html>
